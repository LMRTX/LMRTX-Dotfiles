background {
    monitor =
    path = screenshot   # <-- This captures your desktop to blur it
    blur_passes = 3 
    blur_size = 7
    noise = 0.0116
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    fade_on_empty = true
    font_color = rgb(205, 214, 244)
    inner_color = rgb(0, 0, 0)
    outer_color = rgb(0, 0, 0)
    check_color = rgb(249, 226, 175)
    fail_color = rgb(243, 139, 168)
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(250, 179, 135)
    position = 0, -20
    halign = center
    valign = center
}

# Time (Centered)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(205, 214, 244)
    font_size = 90
    font_family = JetBrains Mono
    position = 0, 100
    halign = center
    valign = center
}
